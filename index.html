<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Accounts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F7F7F5;--card:#FFFFFF;--ink:#17181A;--mut:#80848A;--line:#E8E8E4;--acc:#2F5D3A;--soft:#E9F0EA;--gold:#B7862F;--pos:#2F7D46;--neg:#C23B3B;--warn:#B7791F;--btn:#2F5D3A;--btnink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0F10;--card:#17181A;--ink:#F1F1EF;--mut:#8C9096;--line:#26282B;--acc:#8FC79B;--soft:#1C2A20;--gold:#E0B25C;--pos:#6FCF8A;--neg:#F08585;--warn:#E3B341;--btn:#8FC79B;--btnink:#0E0F10}}
:root[data-theme="dark"]{--bg:#0E0F10;--card:#17181A;--ink:#F1F1EF;--mut:#8C9096;--line:#26282B;--acc:#8FC79B;--soft:#1C2A20;--gold:#E0B25C;--pos:#6FCF8A;--neg:#F08585;--warn:#E3B341;--btn:#8FC79B;--btnink:#0E0F10}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:26px 16px 56px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.shop{color:var(--mut);font-size:13px;font-weight:500}
h1{margin:2px 0 0;font-size:28px;font-weight:700;letter-spacing:-.02em}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,input,select{font:inherit;color:inherit}
.ic,.ghost{background:var(--card);border:1px solid var(--line);border-radius:10px;height:38px;min-width:38px;padding:0 12px;cursor:pointer}
.ic:hover,.ghost:hover{border-color:var(--mut)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;height:40px;padding:0 10px;width:100%}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
.nav input{width:auto;background:var(--card);height:38px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.stat{padding:14px 16px}
.stat small{display:block;color:var(--mut);font-size:12.5px}
.stat b{display:block;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0}
.stat i{font-style:normal;font-size:11.5px;color:var(--mut)}
.stat.main{border-color:var(--acc);background:var(--soft)}
.cashp{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:14px 18px;margin-bottom:14px}
.cashp div small{display:block;color:var(--mut);font-size:12.5px}
.cashp div b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.cashp .ar{color:var(--mut);font-size:18px}
.cashp .sp{margin-left:auto}
.card{margin-bottom:14px}.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:500;color:var(--mut);text-align:right;padding:12px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
td:first-child{color:var(--mut);width:36px}
td.d{white-space:normal;min-width:190px;max-width:260px}
td.d small{display:block;color:var(--mut);font-size:12px}
.b{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;margin-right:6px;background:var(--soft);color:var(--acc)}
.b.o{background:transparent;border:1px solid var(--gold);color:var(--gold)}.b.v{background:transparent;border:1px solid var(--neg);color:var(--neg)}
tr.void td{opacity:.5;text-decoration:line-through}tr.void td:last-child,tr.void td.d small{text-decoration:none}
td.cb{font-weight:600}.pos{color:var(--pos)}.neg{color:var(--neg)}.zero{color:var(--mut)}.warn{color:var(--warn)}
.lnk{background:none;border:0;color:var(--mut);cursor:pointer;padding:2px 6px;font-size:13px}
.lnk:hover{color:var(--ink)}.lnk.adj{color:var(--gold);font-weight:600}
.empty{padding:34px;text-align:center;color:var(--mut)}
form{padding:16px}
.g{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;align-items:end}
.g>div:nth-child(1){grid-column:span 2}.g>div:nth-child(2){grid-column:span 3}.g>div:nth-child(3){grid-column:span 7}
.g>div:nth-child(n+4):nth-child(-n+7){grid-column:span 3}.g>.pp{grid-column:span 6}.pp[hidden]{display:none}.g>.pp{grid-column:span 6}.pp[hidden]{display:none}
.g>.act{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px}
.prev{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.prev b{color:var(--ink);font-weight:600}
.go{height:42px;border:0;border-radius:10px;background:var(--btn);color:var(--btnink);font-weight:600;padding:0 24px;cursor:pointer}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.foot .ghost{height:34px;font-size:13px}
.g>div{position:relative}
.sg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:5;overflow:hidden}
.sg[hidden]{display:none}
.si{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;cursor:pointer;gap:8px}
.si small{color:var(--mut);font-size:12px}
.si.on,.si:hover{background:var(--soft)}
.si .x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
.si .x:hover{color:var(--neg)}
.tg{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.tg input{width:18px;height:18px;accent-color:var(--acc);padding:0}
.daybar{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:12px 18px}
.daybar .sp{margin-left:auto;display:flex;align-items:center;gap:10px}
.dlg.w{max-width:560px}.lg{max-height:55vh;overflow:auto;font-size:13.5px}.lg>div{padding:8px 0;border-bottom:1px solid var(--line)}.lg small{color:var(--mut)}
.sr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.foot #who{margin-right:auto;color:var(--mut);font-size:13px;align-self:center}
.pt,.pf{display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9}
.ov[hidden]{display:none}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:380px}
.dlg h3{margin:0 0 12px;font-size:17px}.dlg .f{margin-bottom:10px}
.oa{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.fb{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:8px;padding:10px 12px}
.fb input,.fb select{height:36px}
.cc{display:grid;grid-template-columns:56px 1fr 84px;gap:6px 10px;align-items:center}.cc label{margin:0}.cc b{text-align:right;font-weight:500;font-size:13px}
.ct{margin-top:12px;display:flex;justify-content:space-between;font-size:16px}
.rt{min-width:0;margin-bottom:6px}.rt td{padding:6px 0;white-space:normal}.rt td:first-child{color:inherit;width:auto}.rt td+td{text-align:right;font-weight:600}
#rpt{display:none}
@media(max-width:760px){.fb{grid-template-columns:1fr 1fr}.fb input:first-child{grid-column:1/-1}}
.ov.lk{background:var(--bg);z-index:20}
@media print{body{background:#fff!important;color:#000!important}.nav,.stats,.daybar,form,#fsec,#cn,.foot,.sg,td:last-child,th:last-child,header .shop{display:none!important}.pt{display:block;text-align:center}.pt h2{margin:0;font-size:26px}.pf{display:flex;justify-content:space-between;margin-top:28px;font-size:14px}.card,.stat{background:#fff!important;border:1px solid #999!important}.wrap{padding:0}td,th,.cashp b,.cashp small{color:#000!important;border-color:#999!important}.pos,.neg,.zero,.warn,.b{color:#000!important}table{min-width:0}tr.void{display:none}.ov,.fb{display:none!important}body.pr .wrap{display:none!important}body.pr #rpt{display:block}}
@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.g>div{grid-column:span 6!important}.g>div:nth-child(3){grid-column:1/-1!important}.cashp .sp{margin-left:0}h1{font-size:24px}}
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2F5D3A"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <div class="pt"><h2>NUR COMPUTER &amp; STATIONARY</h2><div>DAILY ACCOUNTS</div></div>
  <header>
    <div><div class="shop">Nur Computer &amp; Stationary · Daily Accounts</div><h1 id="title"></h1></div>
    <div class="nav">
      <button class="ic" id="pd" aria-label="Previous day">‹</button>
      <input type="date" id="pick" aria-label="Choose date">
      <button class="ic" id="nd" aria-label="Next day">›</button>
      <button class="ghost" id="today">Today</button>
      <button class="ghost" id="theme"></button>
      <button class="ghost" id="set">Settings</button><button class="ghost" id="lockb">Lock</button><button class="ghost" id="lang">বাংলা</button><button class="ghost" id="sync">Sync: Off</button>
    </div>
  </header>

  <section class="stats" id="stats"></section>
  <section class="card cashp" id="cashp"></section>
  <section class="card daybar" id="daybar"></section>
  <section class="card fb" id="fb"><input id="sq" placeholder="Search description or category" autocomplete="off"><select id="sty"><option value="">All types</option><option value="Sale">Sale</option><option value="Purchase">Purchase / Expense</option><option value="Deposit">Owner Deposit</option><option value="Withdrawal">Owner Withdrawal</option><option value="Adjustment">Cash Adjustment (±)</option></select><select id="spy"><option value="">All payments</option><option>Cash</option><option>Mobile Banking</option><option>Bank</option><option>Due</option></select><input id="sfa" type="date" title="From"><input id="sfb" type="date" title="To"><button class="ghost" id="sclr">Clear</button></section>
  <section class="card scroll"><div id="tbl"></div></section>
  <div class="pf" id="pf"></div>

  <div class="card empty" id="cn" hidden>This day is closed. An admin can reopen it to add or change entries.</div>
  <section class="card" id="fsec"><form id="form" autocomplete="off"><div class="g">
    <div><label for="ft">Time</label><input id="ft" type="time" required></div>
    <div><label for="fy">Type</label><select id="fy"><option value="Sale">Sale</option><option value="Purchase">Purchase / Expense</option><option value="Deposit">Owner Deposit</option><option value="Withdrawal">Owner Withdrawal</option><option value="Adjustment">Cash Adjustment (±)</option></select></div>
    <div><label for="fd">Description</label><input id="fd" type="text" required maxlength="120" placeholder="Type product or cost name" autocomplete="off"><div class="sg" id="sg" hidden></div></div>
    <div><label for="fc">Category</label><select id="fc"></select></div>
    <div><label for="fp">Payment method</label><select id="fp"><option>Cash</option><option>Mobile Banking</option><option>Bank</option><option>Due</option></select></div>
    <div><label for="fa">Amount</label><input id="fa" type="number" inputmode="decimal" step="any" min="0" required placeholder="0"></div>
    <div><label for="fx">Actual cash (optional) <button type="button" class="lnk adj" id="cnt">Count</button></label><input id="fx" type="number" inputmode="decimal" step="any" min="0" placeholder="0"></div>
    <div class="pp" id="ppn" hidden><label for="fpn" id="fpl">Customer name</label><input id="fpn" list="pl" maxlength="60" autocomplete="off"><datalist id="pl"></datalist></div><div class="pp" id="ppt" hidden><label for="fph">Phone (optional)</label><input id="fph" type="tel" maxlength="20" autocomplete="off"></div>
    <div class="act"><div class="prev" id="prev"></div><div><button type="button" class="ghost" id="cancel" style="display:none">Cancel edit</button> <button class="go" id="go" type="submit">Add entry</button></div></div>
  </div></form></section>

  <div class="foot"><span id="who"></span><button class="ghost" id="stf">Staff</button><button class="ghost" id="logb">Change Log</button><button class="ghost" id="rpb">Reports</button><button class="ghost" id="und" disabled>Undo</button><button class="ghost" id="prt">Print</button><button class="ghost" id="csv">Export CSV</button></div>
</div>

<div class="ov" id="ov" hidden><div class="dlg"><h3 id="ot"></h3><div id="ob"></div><div class="oa"><button class="ghost" id="oc">Cancel</button><button class="go" id="ok">Confirm</button></div></div></div>

<div id="rpt"></div>
<div class="ov lk" id="lk" hidden></div>
<script>
const KEY='ncs_accounts_v2',$=id=>document.getElementById(id);
const E=(id,t,type,desc,cat,amt,x)=>({id,d:'2026-10-08',t,type,desc,cat,pay:'Cash',amt,...x});
const seed=()=>({start:0,theme:'auto',dayStart:'06:00',dayEnd:'18:00',entries:[
 E(1,'20:30','Sale','Sales till 8:30 PM','Printing',55100),
 E(2,'20:30','Purchase','Purchases till 8:30 PM','Stock',27560,{act:36550,adj:1}),
 E(3,'20:30','Adjustment','Cash adjustment · Extra cash','',9010),
 E(4,'21:46','Sale','Sales till 9:46 PM','Stationery',37500),
 E(5,'21:46','Purchase','Purchases till 9:46 PM','Stock',24360,{act:49750}),
 E(6,'23:47','Sale','Sales till 11:47 PM','Computer Service',4610),
 E(7,'23:47','Purchase','Tea & snacks','Other',10,{act:55280})]});
let S;try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):seed()}catch(e){S=seed()}
S.names=S.names||{};S.parties=S.parties||{};
const ENC=(window.NCS_CONFIG||{}).enc;
if(!S.sync&&window.NCS_CONFIG&&/^https:\/\//.test(NCS_CONFIG.url||'')&&NCS_CONFIG.key)S.sync={url:NCS_CONFIG.url,key:NCS_CONFIG.key};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const save=()=>{S.rev=(S.rev||0)+1;persist();schedule()};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let cur=S.entries.length?S.entries[S.entries.length-1].d:iso(new Date()),editing=null;
const n=v=>Number(v).toLocaleString('en-US'),tk=v=>'৳'+n(v);
const money=v=>v?n(v):'–',dif=v=>v===0?'0':(v>0?'+':'−')+n(Math.abs(v)),dc=v=>v>0?'pos':v<0?'neg':'zero';
const t12=t=>{const h=+t.slice(0,2);return ((h+11)%12+1)+':'+t.slice(3,5)+' '+(h<12?'AM':'PM')};
const label=d=>{const x=new Date(d+'T00:00:00');return x.getDate()+'.'+String(x.getMonth()+1).padStart(2,'0')+'.'+x.getFullYear()+' – '+x.toLocaleDateString(S.lang==='bn'?'bn-BD':'en-US',{weekday:'long'})};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sorted=()=>[...S.entries].sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t)||a.id-b.id);
const cash=e=>e.void?0:e.type==='Sale'?(e.pay==='Cash'?e.amt:0):e.type==='Purchase'?(e.pay==='Cash'?-e.amt:0):e.type==='Deposit'?e.amt:e.type==='Withdrawal'?-e.amt:e.amt;
function calc(){let p=+S.start||0;const m={};sorted().forEach(e=>{if(e.void)return;const bal=p+cash(e);m[e.id]={p,bal,df:e.act==null?null:e.act-bal};p=bal});return m}
const prevFor=(d,t)=>{let p=+S.start||0;sorted().forEach(e=>{if(!e.void&&e.id!==editing&&(e.d+e.t)<=(d+t))p+=cash(e)});return p};
const CATS={Sale:['Printing','Stationery','Computer Service','Other'],Purchase:['Stock','Rent','Salary','Utilities','Transport','Other']};

function render(){
  $('title').textContent=label(cur);$('pick').value=cur;
  const m=calc(),all=sorted(),day=all.filter(e=>e.d===cur),act=day.filter(e=>!e.void),f=flt(),tv=f?all.filter(e=>match(e,f)):day;
  const sum=(ty)=>act.filter(e=>e.type===ty),tot=a=>a.reduce((s,e)=>s+e.amt,0);
  const split=a=>{const c=tot(a.filter(e=>e.pay==='Cash')),g=tot(a.filter(e=>e.pay==='Mobile Banking'||e.pay==='Bank')),u=tot(a.filter(e=>e.pay==='Due'));return `Cash ${n(c)} · Digital ${n(g)} · Due ${n(u)}`};
  const sl=sum('Sale'),pu=sum('Purchase');
  const pend=act.reduce((s,e)=>s+(m[e.id].df!=null&&!e.adj?m[e.id].df:0),0);
  let open=+S.start||0;all.forEach(e=>{if(!e.void&&e.d<cur)open+=cash(e)});
  const close=act.length?m[act[act.length-1].id].bal:open,adjT=act.filter(e=>e.type==='Adjustment').reduce((s,e)=>s+e.amt,0);
  $('stats').innerHTML=`<div class="stat"><small>Total Sell</small><b>${tk(tot(sl))}</b><i>${split(sl)}</i></div><div class="stat"><small>Total Buy</small><b>${tk(tot(pu))}</b><i>${split(pu)}</i></div><div class="stat"><small>Difference (pending)</small><b class="${dc(pend)}">${dif(pend)}</b><i>Counted vs account</i></div><div class="stat main"><small>Cash Balance</small><b>${tk(close)}</b><i>Account balance now</i></div>`;
  $('cashp').innerHTML=`<div><small>Opening Cash</small><b>${tk(open)}</b></div><span class="ar">→</span><div><small>Closing Cash</small><b>${tk(close)}</b></div><div class="sp"><small>Adjustments today</small><b class="${dc(adjT)}">${dif(adjT)}</b></div>`;
  if(!tv.length)$('tbl').innerHTML='<div class="empty">No entries for this date</div>';
  else $('tbl').innerHTML='<table><thead><tr><th>Sl</th><th>Time</th><th>Description</th><th>Sell</th><th>Buy</th><th>Previous Cash</th><th>Cash Balance</th><th>Actual Cash</th><th>Difference</th><th></th></tr></thead><tbody>'+tv.map((e,i)=>{
    const r=m[e.id],v=e.void,inn=e.type==='Sale'||e.type==='Deposit'||(e.type==='Adjustment'&&e.amt>0),amt=Math.abs(e.amt);
    const badge=(e.type!=='Sale'&&e.type!=='Purchase'?`<span class="b o">${e.type==='Adjustment'?'Adjustment':e.type==='Deposit'?'Deposit':'Withdrawal'}</span>`:'')+(e.pay!=='Cash'&&(e.type==='Sale'||e.type==='Purchase')?`<span class="b">${e.pay}</span>`:'')+(v?'<span class="b v">Void</span>':'');
    const sub=v?`Reason: ${esc(e.vr)}`:(f?sd(e.d)+' · ':'')+esc(e.cat)+(e.party?' · '+esc(e.party)+(e.phone?' ('+esc(e.phone)+')':''):'')+(e.by?' · '+esc(e.by):'');
    const dfc=!v&&r.df!=null?`<span class="${dc(r.df)}">${dif(r.df)}</span>${e.adj?' <span class="b">Adjusted</span>':''}`:'–';
    const acts=(v||f||!isA()||closed())?'':`<button class="lnk" data-a="e" data-i="${e.id}">Edit</button><button class="lnk" data-a="v" data-i="${e.id}">Void</button>`+(r.df&&!e.adj?`<button class="lnk adj" data-a="a" data-i="${e.id}">Adjust</button>`:'');
    return `<tr class="${v?'void':''}"><td>${i+1}</td><td>${t12(e.t)}</td><td class="d">${badge}${esc(e.desc)}<small>${sub}</small></td><td>${inn?money(amt):'–'}</td><td>${inn?'–':money(amt)}</td><td>${v||!r.p?'–':n(r.p)}</td><td class="cb">${v?'–':n(r.bal)}</td><td>${!v&&e.act!=null?n(e.act):'–'}</td><td>${dfc}</td><td>${acts}</td></tr>`}).join('')+'</tbody></table>';
  preview();dayBar();
}

function cats(){const c=CATS[$('fy').value];$('fc').innerHTML=c?c.map(x=>`<option>${x}</option>`).join(''):'<option value="">—</option>';$('fc').disabled=!c;
  const nc=['Sale','Purchase'].includes($('fy').value);$('fp').disabled=!nc;if(!nc)$('fp').value='Cash';$('fa').min=$('fy').value==='Adjustment'?'':'0';party()}
function party(){const d=$('fp').value==='Due'&&['Sale','Purchase'].includes($('fy').value);$('ppn').hidden=$('ppt').hidden=!d;$('fpn').required=d;$('fpl').textContent=$('fy').value==='Purchase'?'Supplier name':'Customer name';const L=S.parties[$('fy').value]||{};$('pl').innerHTML=Object.keys(L).map(k=>`<option value="${esc(k)}">`).join('')}
$('fpn').addEventListener('input',()=>{const L=S.parties[$('fy').value]||{},v=$('fpn').value.trim();if(v in L&&!$('fph').value)$('fph').value=L[v]});
function preview(){
  const t=$('ft').value||'00:00',p=prevFor(cur,t),ty=$('fy').value,a=+$('fa').value||0,pay=$('fp').value;
  const eff=cash({type:ty,pay,amt:a}),bal=p+eff;
  let h=`<span>Previous <b>${n(p)}</b></span><span>Cash Balance <b class="${bal<0?'neg':''}">${n(bal)}</b></span>`;
  if($('fx').value!=='')h+=`<span>Difference <b class="${dc((+$('fx').value)-bal)}">${dif((+$('fx').value)-bal)}</b></span>`;
  if(bal<0)h+='<span class="warn">Balance would be negative</span>';
  $('prev').innerHTML=h;
}

const rnd=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(x=>x.toString(36).padStart(2,'0')).join('');
async function H(p,salt){const b=new TextEncoder().encode(salt+':'+p);try{const d=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;b.forEach(c=>h=(h*33^c)>>>0);return 'x'+h}}
const mk=async p=>{const s=rnd(8);return{s,h:await H(p,s)}};

function lockUI(mode,msg){
  const lk=$('lk');lk.hidden=false;
  const F=(id,l,t)=>`<div class="f"><label>${l}</label><input id="${id}" type="${t||'password'}" ${t?'':'inputmode="numeric" '}autocomplete="off"></div>`;
  let h,btn='Unlock',title='Sign in';
  if(mode==='connect'){title='Connect to shop';btn='Connect';h='<p>Enter the shop passphrase to connect this device. You only need to do this once.</p>'+F('pw','Shop passphrase','password')}
  else if(mode==='first'){title='Create admin PIN';btn='Create';h=F('p1','Admin PIN (4+ digits)')+F('p2','Confirm PIN')}
  else if(mode==='recover'){title='Reset admin PIN';btn='Reset';h=F('rc','Recovery code','text')+F('p1','New PIN')+F('p2','Confirm PIN')}
  else if(mode==='code'){title='Recovery code';btn='Continue';h=`<p>Write this code down. It is the only way to reset the admin PIN.</p><h2 style="letter-spacing:.15em;text-align:center">${msg}</h2>`}
  else h=`<div class="f"><label>User</label><select id="lu"><option value="admin">Admin</option>${S.users.staff.filter(x=>x.on).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>`+F('p1','PIN');
  lk.innerHTML=`<div class="dlg"><h3>${title}</h3>${h}<div id="le" class="neg"></div><div class="oa">${mode==='login'?'<button class="ghost" id="fg">Forgot admin PIN</button>':''}<button class="go" id="lgo">${btn}</button></div></div>`;
  const err=t=>$('le').textContent=t,v=id=>$(id)?$(id).value:'';
  if($('p1'))$('p1').focus();else if($('rc'))$('rc').focus();else if($('pw'))$('pw').focus();
  if($('fg'))$('fg').onclick=()=>lockUI('recover');
  const go=async()=>{
    if(mode==='connect'){try{const c=await decCfg(ENC,v('pw'));S.sync={url:c.url,key:c.key};persist();return start()}catch(e){return err('Wrong passphrase')}}
    if(mode==='code'){startSess();return enter()}
    if(mode==='first'||mode==='recover'){const a=v('p1');if(a.length<4||a!==v('p2'))return err('PINs must match and be 4+ digits');
      if(mode==='first'){const c=rnd(3).toUpperCase();S.users={admin:await mk(a),staff:[],rec:await mk(c)};U={name:'Admin',role:'admin',id:'admin'};lg('Admin created','');save();return lockUI('code',c)}
      if(!(await ck(S.users.rec,v('rc').trim().toUpperCase())))return err('Wrong recovery code');
      S.users.admin=await mk(a);U=null;lg('Admin PIN reset','');save();return lockUI('login')}
    const L=S.lockout||{n:0,until:0};if(Date.now()<L.until)return err('Too many attempts. Try again in a minute.');
    const id=v('lu'),st=S.users.staff.find(x=>x.id==id),o=id==='admin'?S.users.admin:st;
    if(o&&await ck(o,v('p1'))){S.lockout={n:0,until:0};U={name:id==='admin'?'Admin':st.name,role:id==='admin'?'admin':'staff',id};lg('Login','');save();startSess();enter()}
    else{L.n++;if(L.n>=5){L.until=Date.now()+60000;L.n=0}S.lockout=L;save();err('Wrong PIN')}
  };
  $('lgo').onclick=go;lk.onkeydown=e=>{if(e.key==='Enter')go()}
}

function repHTML(p){const[a,b]=rng(p),all=sorted().filter(e=>!e.void),R=all.filter(e=>e.d>=a&&e.d<=b);
  let o=+S.start||0;all.forEach(e=>{if(e.d<a)o+=cash(e)});let c=o;R.forEach(e=>c+=cash(e));
  const T=y=>R.filter(e=>e.type===y),sm=l=>l.reduce((q,e)=>q+e.amt,0),sl=sm(T('Sale')),pu=sm(T('Purchase'));
  const L=[['Total Sell',sl],['Total Buy',pu],['Net (Sell − Buy)',sl-pu],['Owner Deposit',sm(T('Deposit'))],['Owner Withdrawal',sm(T('Withdrawal'))],['Adjustments',sm(T('Adjustment'))],['Opening Cash',o],['Closing Cash',c]];
  const G=y=>{const m={};T(y).forEach(e=>{const k=e.cat||'Other';m[k]=(m[k]||0)+e.amt});return Object.entries(m).sort((x,z)=>z[1]-x[1])};
  const gs=G('Sale'),gp=G('Purchase');RR={a,b,L,gs,gp};
  const tb=r=>'<table class="rt">'+r.map(x=>`<tr><td>${esc(x[0])}</td><td>${n(x[1])}</td></tr>`).join('')+'</table>';

const orig=new WeakMap();
function tx(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let x;while(x=w.nextNode()){if(!orig.has(x))orig.set(x,x.nodeValue);const o=orig.get(x);
  x.nodeValue=S.lang==='bn'?o.split(' · ').map(q=>{const t=q.trim();return BN[t]?q.replace(t,BN[t]):q}).join(' · '):o}}
new MutationObserver(()=>tx(document.body)).observe(document.body,{childList:true,subtree:true});
function applyLang(){const b=S.lang==='bn';document.documentElement.lang=b?'bn':'en';$('lang').textContent=b?'English':'বাংলা';$('fd').placeholder=b?'পণ্য বা খরচের নাম লিখুন':'Type product or cost name';$('sq').placeholder=b?'বিবরণ বা ক্যাটাগরি খুঁজুন':'Search description or category';tx(document.body);if(U)render()}
$('lang').onclick=()=>{S.lang=S.lang==='bn'?'en':'bn';save();applyLang()};

async function dlFile(name,data){try{if(typeof claude!=='undefined'){const dl=await claude.use('downloads');if(dl)return dl.save({filename:name,data})}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download=name;a.click()}catch(e){}}
const LOCAL=['theme','dayStart','dayEnd','lang','lockout','sync','snaps','logSent','synced'];
const SY=()=>!!(S.sync&&S.sync.url&&S.sync.key),isDirty=()=>(S.rev||0)!==(S.synced||0);
let st='off',tm,busy=false;
function setSt(x){st=x;$('sync').textContent='Sync: '+{off:'Off',ok:'Synced',pend:'Pending',offl:'Offline',conf:'Conflict'}[x]}
function schedule(){if(!SY())return;setSt('pend');clearTimeout(tm);tm=setTimeout(()=>push(),2000)}
const HEAD=['Date','Time','Type','Description','Category','Payment','Amount','Previous Cash','Cash Balance','Actual Cash','Difference','Status','Entered by','Party','Phone'];
function rowsOut(){const m=calc();return sorted().map(e=>{const r=m[e.id]||{};return[e.d,e.t,e.type,e.desc,e.cat||'',e.pay,e.amt,r.p??'',r.bal??'',e.act??'',r.df??'',e.void?'Void: '+e.vr:'Active',e.by||'',e.party||'',e.phone||'']})}
function stateOut(){const o={};for(const k in S)if(!LOCAL.includes(k))o[k]=S[k];return o}
const getRemote=async()=>(await fetch(S.sync.url+(S.sync.url.includes('?')?'&':'?')+'action=pull&key='+encodeURIComponent(S.sync.key))).json();
async function push(force){
  if(!SY()||!U||busy)return;busy=true;
  try{
    const sn=Object.keys(S.days).filter(d=>S.days[d].closed&&!(S.snaps||[]).includes(d)),nl=S.log.filter(l=>l.i>(S.logSent||0)).reverse(),rev=S.rev;
    const r=await(await fetch(S.sync.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:S.sync.key,base:S.synced||0,force:!!force,rev,state:JSON.stringify(stateOut()),head:HEAD,rows:rowsOut(),log:nl.map(l=>[l.ts,l.u,l.a,l.d]),snaps:sn})})).json();
    if(r.conflict){setSt('conf');busy=false;return}
    if(r.ok===false){busy=false;return badKey()}if(!r.ok)throw 0;
    S.synced=rev;S.snaps=[...(S.snaps||[]),...sn];if(S.log.length)S.logSent=Math.max(...S.log.map(l=>l.i));persist();setSt(isDirty()?'pend':'ok');if(isDirty())schedule()
  }catch(e){setSt('offl')}
  busy=false}
function applyRemote(r){const k={};LOCAL.forEach(x=>{if(x in S)k[x]=S[x]});S=Object.assign({},JSON.parse(r.state),k,{rev:r.rev,synced:r.rev});persist();if(U){reset();render()}setSt('ok')}
async function pull(){
  if(!SY()||busy)return;
  try{const r=await getRemote();if(r.ok===false)return badKey();if(!r.ok)throw 0;
    if(r.rev>(S.synced||0)){if(isDirty()){setSt('conf');return}applyRemote(r)}
    else if(isDirty()||(!r.rev&&S.entries.length))push();else setSt('ok')
  }catch(e){setSt('offl')}}

const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))),ub=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function kdf(pw,salt,n){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encCfg(o,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),n=600000,k=await kdf(pw,salt,n);return{s:b64(salt),i:b64(iv),c:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(o)))),n}}
async function decCfg(e,pw){const k=await kdf(pw,ub(e.s),e.n);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(e.i)},k,ub(e.c))))}
function badKey(){setSt('offl');if(!ENC||!U)return;S.sync=null;persist();ask('Reconnect sync','<p>The sync key changed. Enter the shop passphrase to reconnect.</p><div class="f"><label>Shop passphrase</label><input id="rcp" type="password"></div>',async()=>{try{const c=await decCfg(ENC,$('rcp').value);S.sync={url:c.url,key:c.key};persist();pull()}catch(e){$('rcp').value='';$('rcp').placeholder='Wrong passphrase';return false}},'Reconnect')}
$('ob').addEventListener('click',e=>{if(e.target.id!=='ssu')return;
  ask('Secure sync setup',`<p>Creates an encrypted config.js that is safe in a public repository.</p><div class="f"><label>Web app URL</label><input id="g1" value="${esc(S.sync?S.sync.url:'')}"></div><div class="f"><label>Sync key (the key in your Apps Script)</label><input id="g2" type="password"></div><div class="f"><label>Shop passphrase (12+ characters)</label><input id="g3" type="password"></div><div class="f"><label>Repeat passphrase</label><input id="g4" type="password"></div>`,async()=>{
    const u=$('g1').value.trim(),k=$('g2').value.trim(),p=$('g3').value;
    if(!/^https:\/\//.test(u)||!k||p.length<12||p!==$('g4').value){$('g4').value='';$('g4').placeholder='Check URL, key, and matching passphrase (12+)';return false}
    const en=await encCfg({url:u,key:k},p);await decCfg(en,p);S.sync={url:u,key:k};persist();
    const txt='// Encrypted sync setup. Safe to keep in a public repository.\nwindow.NCS_CONFIG = '+JSON.stringify({enc:en})+';\n';
    setTimeout(()=>ask('Your new config.js',`<p>Copy all of this and paste it into config.js on GitHub (replace everything), then commit.</p><textarea id="cfo" readonly rows="7" style="width:100%;font:12px monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:8px">${esc(txt)}</textarea><div class="oa"><button class="ghost" id="cfc">Copy</button></div>`,()=>{},'Done'),0);pull()},'Generate')});
$('ob').addEventListener('click',async e=>{if(e.target.id!=='cfc')return;const t=$('cfo');t.select();try{await navigator.clipboard.writeText(t.value)}catch(x){document.execCommand('copy')}e.target.textContent='Copied'});
function startSess(){exp=Date.now()+864e5;const r=U.role==='admin'?S.users.admin:S.users.staff.find(x=>x.id==U.id);try{localStorage.setItem(SESS,JSON.stringify({u:U,exp,h:r.h}))}catch(e){}}
function resume(){try{const q=JSON.parse(localStorage.getItem(SESS)||'null');if(!q||Date.now()>q.exp)return false;
  const r=q.u.role==='admin'?S.users.admin:S.users.staff.find(x=>x.id==q.u.id&&x.on);
  if(!r||r.h!==q.h)return false;U=q.u;exp=q.exp;enter();return true}catch(e){return false}}
async function start(){if(ENC&&!SY()){lockUI('connect');return}if(!S.users&&SY()){try{const r=await getRemote();if(r.ok&&r.rev&&r.state)applyRemote(r)}catch(e){}}if(S.users&&resume())return;S.users?lockUI('login'):lockUI('first')}
applyLang();start();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
